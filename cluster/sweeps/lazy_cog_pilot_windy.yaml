# Pilot (2026-10-26): where the samples of Lazy SF-FSA-VI's CoG growth go. Same settings as lazy_mf.yaml (QINHERIT=0,
# the setting Figure 5 shows for the Lazy arms), only the Lazy part; q_lazy_fsa.py now records per growth the two
# phases (metapolicy learn; estimate refinement on B(s) or the continued learn on all actions) and why checks failed.
name: lazy_cog_pilot_windy
command: env {domain} python q_lazy_fsa.py {cpus}
grid:
  domain: ["QDOM=windy QNTASK=60"]
  QSEED: [2, 3]
env:
  QINIT: zero
  QESTIMATE: 1
  QDELTA: 1e-3
  QDELTAEST: 1e-2
  QBASE: 5e7
  QBUDGET: 5e7
  QFLAT: 3e8
  QOLSMAX: 100
  QROUNDS: 5
  QINHERIT: 0
  QPARTS: lazy
slurm:
  partition: amd
  cpus: 16
  pack: 2
  mem: 12G
  time: "03:00:00"
