# Pilot 3 of q_lazy_fsa.py: model-free Certify-or-Grow that learns only the metapolicy's policy before deciding.
name: lazy_mf_pilot3
command: python q_lazy_fsa.py {cpus}
runs:
  - {QDOM: windy}
  - {QDOM: office, QSLIP: 0.1}
  - {QDOM: ds}
env:
  QINIT: zero
  QDELTA: 1e-3
  QNTASK: 8
  QBASE: 5e7
  QBUDGET: 5e7
  QFLAT: 3e8
  QOLSMAX: 40
  QPARTS: lazy,flat
slurm:
  partition: amd
  cpus: 16
  mem: 24G
  time: "04:00:00"
