# Pilot 5 of q_lazy_fsa.py: warm starts with or without inherited visit counts (policies 1e-3, estimates 1e-2).
name: lazy_mf_pilot5
command: python q_lazy_fsa.py {cpus}
grid:
  QDOM: [windy, ds, office]
  QINHERIT: [0, 1]
env:
  QSLIP: 0.3
  QINIT: zero
  QDELTA: 1e-3
  QDELTAEST: 1e-2
  QNTASK: 8
  QBASE: 5e7
  QBUDGET: 5e7
  QFLAT: 3e8
  QOLSMAX: 40
slurm:
  partition: amd
  cpus: 16
  mem: 24G
  time: "04:00:00"
