# Pilot of the model-free Lazy SF-FSA-VI comparison (q_lazy_fsa.py): domains x initialisation of the SF learners,
# few tasks, reduced budgets, to choose the settings of lazy_mf.yaml.
name: lazy_mf_pilot
command: python q_lazy_fsa.py {cpus}
grid:
  QDOM: [office, windy, ds]
  QINIT: [opt, zero]
runs:
  - {QDOM: office, QSLIP: 0.3, QINIT: opt}
  - {QDOM: office, QSLIP: 0.3, QINIT: zero}
env:
  QSLIP: 0.1
  QNTASK: 8
  QBASE: 3e7
  QBUDGET: 3e7
  QFLAT: 1e8
  QOLSMAX: 40
slurm:
  partition: amd
  cpus: 8
  mem: 16G
  time: "04:00:00"
